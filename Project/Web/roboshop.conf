server {
    listen 80;

    proxy_http_version 1.1;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        ssi on;
    }

    location /images/ {
        expires 5s;
        root /usr/share/nginx/html;
        try_files $uri /images/placeholder.png;
    }

    

    location /health {
        stub_status on;
        access_log off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
